<!DOCTYPE html>
<html>
<head>
    <title>Gerador de Keys</title>
    <style>
        body { font-family: Arial; background: #1a1a1a; color: #fff; padding: 20px; }
        input, button { padding: 10px; margin: 5px; border-radius: 5px; border: none; }
        button { background: #8a2be2; color: #fff; cursor: pointer; }
        #result { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Gerador de Keys - Dede Hub X</h1>
    <label>Token secreto:</label>
    <input type="password" id="token" placeholder="Token admin">
    <br>
    <label>Duração (dias):</label>
    <input type="number" id="duration" value="30">
    <br>
    <label>Nota:</label>
    <input type="text" id="note" placeholder="Ex: cliente João">
    <br>
    <button onclick="generateKey()">Gerar Key</button>
    <div id="result"></div>

    <script>
        async function generateKey() {
            const token = document.getElementById('token').value;
            const durationDays = document.getElementById('duration').value;
            const note = document.getElementById('note').value;

            const response = await fetch('/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, durationDays, note })
            });

            const data = await response.json();
            if (data.key) {
                document.getElementById('result').innerText = `Key gerada: ${data.key}`;
            } else {
                document.getElementById('result').innerText = 'Erro: ' + (data.error || 'desconhecido');
            }
        }
    </script>
</body>
</html>
